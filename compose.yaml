
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  account-service:
    build:
      context: .
      dockerfile: modules/account-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      INVEST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      INVEST_DB_DRIVER: org.postgresql.Driver
      INVEST_DB_USER: ${POSTGRES_USER}
      INVEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVEST_JWT_SECRET: ${INVEST_JWT_SECRET}
      INVEST_ADM_SECRET: ${INVEST_ADM_SECRET}
      INVEST_LLM_API_SECRET: ${INVEST_LLM_API_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  market-service:
    build:
      context: .
      dockerfile: modules/market-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      INVEST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      INVEST_DB_DRIVER: org.postgresql.Driver
      INVEST_DB_USER: ${POSTGRES_USER}
      INVEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVEST_JWT_SECRET: ${INVEST_JWT_SECRET}
      INVEST_ADM_SECRET: ${INVEST_ADM_SECRET}
      INVEST_LLM_API_SECRET: ${INVEST_LLM_API_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - account-service
      - market-service

volumes:
  postgres-data:
