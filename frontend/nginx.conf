server {
    listen 80;
    server_name _;

    # Встроенный DNS Docker + резолв апстримов в рантайме (через переменные в proxy_pass),
    # чтобы пересоздание контейнеров бэкенда (смена IP) не приводило к 502 из-за кеша nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $account http://account-service:8081;
    set $market  http://market-service:8082;

    root /usr/share/nginx/html;
    index index.html;

    # Проксируем на бэкенд только НЕ-навигационные запросы. Навигацию браузера
    # (Accept: text/html) отдаёт SPA — это разруливает коллизии /auth/* и /news,
    # которые одновременно являются и клиентскими маршрутами, и API.
    set $spa 0;
    if ($http_accept ~* text/html) { set $spa 1; }

    # ---- account-service ----
    location /auth/          { if ($spa) { rewrite ^ /index.html last; } proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /portfolio/     { proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /getMyProfile   { proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /changeProfile  { proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /deleteMyAccount{ proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /getAdmin       { proxy_pass $account; include /etc/nginx/proxy_common.conf; }
    location /bugReport      { proxy_pass $account; include /etc/nginx/proxy_common.conf; }

    # ---- market-service ----
    location /stocks/        { proxy_pass $market; include /etc/nginx/proxy_common.conf; }
    location = /news         { if ($spa) { rewrite ^ /index.html last; } proxy_pass $market; include /etc/nginx/proxy_common.conf; }

    # WebSocket цен
    location /ws/ {
        proxy_pass $market;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA-фолбэк для всех остальных маршрутов React-роутера
    location / {
        try_files $uri $uri/ /index.html;
    }
}
